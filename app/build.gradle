plugins { id 'com.android.application' }

android {
    namespace 'com.innerrecord.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.innerrecord.app'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/tandroidlame.aar')
}
